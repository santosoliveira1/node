<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>formulario</title>

        <link rel="stylesheet" href="style.css">

    </head>
    <body>

        <form class="meu_formulario">

            <h2>Formulário JS</h2>

            <label for="nome">Nome</label>
            <input type="text" id="nome" placeholder="Seu nome"
                required>

            <label for="email">E-mail</label>
            <input type="text" id="email" placeholder="Seu email"
                required>

            <label for="telefone">Telefone</label>
            <input type="tel" id="telefone" placeholder="Seu telefone"
                required>

            <button type="button" onclick="clique()">Enviar</button>

        </form>

        <table id="tabela" class="styled_table">
            <thead>
                <tr>
                    <th>nome</th>
                    <th>email</th>
                    <th>telefone</th>
                </tr>

            </thead>

            <tbody id="corpo_tabela"></tbody>
        </table>
          <div class="container_lista">
        <h3>Histórico de Envios</h3>
        <div id="lista_cadastros"></div>
    </div>
        <script src="index.js"></script>
    </body>
</html>

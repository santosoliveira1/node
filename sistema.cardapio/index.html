<!DOCTYPE html>
<html lang="pt-br">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Registo de Produtos</title>
        <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; color: #333; }
        .container { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #4a4a4a; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background-color: #5c6bc0; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #3f51b5; }
        .nav-link { display: block; text-align: center; margin-top: 15px; color: #3f51b5; text-decoration: none; }
        .nav-link:hover { text-decoration: underline; }
    </style>
    </head>
    <body>

        <div class="container">
            <h2>Registar Produto</h2>
            <form id="productForm">
                <div class="form-group">
                    <label for="name">Nome do Produto:</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-group">
                    <label for="price">Preço (R$):</label>
                    <input type="number" id="price" step="0.01" required>
                </div>
                <div class="form-group">
                    <label for="quantity">Quantidade:</label>
                    <input type="number" id="quantity" step="1" required>
                </div>
                <button type="submit">Guardar Produto</button>
            </form>
            <a href="estoque.html" class="nav-link">Ver Estoque de Produtos →</a>
        </div>

        <script>
    document.getElementById('productForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const name = document.getElementById('name').value.trim();
        const price = parseFloat(document.getElementById('price').value);
        const quantity = parseInt(document.getElementById('quantity').value, 10);

        // Validação de campos vazios
        if (!name || isNaN(price) || isNaN(quantity)) {
            alert('Por favor, preencha todos os campos obrigatórios.');
            return;
        }

        // Validação de valores maiores que zero
        if (price <= 0 || quantity <= 0) {
            alert('O preço e a quantidade devem ser maiores que zero.');
            return;
        }

        // Obter produtos existentes do LocalStorage
        let products = JSON.parse(localStorage.getItem('products')) || [];

        // Validação de nome duplicado (ignora maiúsculas/minúsculas)
        const isDuplicate = products.some(p => p.name.toLowerCase() === name.toLowerCase());
        if (isDuplicate) {
            alert('Já existe um produto registado com este nome.');
            return;
        }

        // Adicionar novo produto ao array
        const newProduct = { name, price, quantity };
        products.push(newProduct);

        // Guardar no LocalStorage
        localStorage.setItem('products', JSON.stringify(products));

        alert('Produto registado com sucesso!');
        
        // Limpar o formulário
        document.getElementById('productForm').reset();
    });
</script>

    </body>
</html>
